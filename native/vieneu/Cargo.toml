[package]
name = "sachnoi-vieneu"
version = "0.1.0"
edition = "2021"
description = "Chạy mô hình VieNeu-TTS trên máy, không cần Python"

[lib]
name = "sachnoi_vieneu"
# staticlib thêm cho iOS: onnxruntime trên iOS chỉ phát hành dạng tĩnh (xem
# ghi chú `load-dynamic` bên dưới), và Xcode cũng cần liên kết tĩnh thư viện
# này vào thẳng file thực thi (`DynamicLibrary.process()` bên Dart) chứ không
# nạp .dylib rời như macOS.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Chuyển chữ sang âm vị — dùng lại lõi Rust của sea-g2p đã port sang Android.
sea-g2p-rs = { path = "../sea-g2p", default-features = false, features = ["ffi"] }

# ONNX Runtime. `load-dynamic` nghĩa là nạp libonnxruntime lúc chạy chứ không
# liên kết lúc build: cross-compile sang Android khỏi cần thư viện của Android
# lúc dựng, và bản .so của Microsoft đi kèm APK là dùng được ngay. Trên iOS thì
# ngược lại — Apple không cho nạp động thư viện lạ, và bản onnxruntime chính
# thức của Microsoft cho iOS cũng chỉ phát hành dạng .xcframework tĩnh — nên
# `load-dynamic` tắt qua feature `static-ort` (xem [features] bên dưới), và
# `ort-sys` tự tìm `onnxruntime.xcframework` qua biến môi trường
# `ORT_IOS_XCFWK_PATH` lúc build (không cần khai gì thêm ở đây).
# `std` trước đây được bật gián tiếp qua feature `load-dynamic` (nó cần std để
# gọi libloading); tắt load-dynamic cho iOS thì phải khai std ra tường minh —
# thiếu nó mất luôn `SessionBuilder::commit_from_file`.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["ndarray", "std"] }

ndarray = "0.17"
rand = "0.8"

# Chính là thư viện Rust mà `tokenizers` bên Python bọc lại, nên tách token ra
# kết quả giống hệt. Bỏ các tính năng cần thư viện C để cross-compile cho gọn.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = ["load-dynamic"]
load-dynamic = ["ort/load-dynamic"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Engine VieNeu v2 (Qwen3 0.3B, trọng số GGUF Q4) chạy qua llama.cpp.
#
# Vì sao không dùng ONNX như v3: v2 chỉ phát hành safetensors và GGUF, không có
# bản ONNX nào. Mà kể cả có thì llama.cpp vẫn hợp hơn cho vòng lặp sinh từng
# token một — kernel ARM/x86 viết tay cho ma trận đã lượng tử, KV cache lớn dần
# là ca dùng chính của nó, và trọng số nạp bằng mmap nên nhiều worker lúc xuất
# file dùng chung một bản trong page cache thay vì mỗi bản một vùng nhớ riêng.
#
# Khai cho MỌI nền tảng, kể cả Android: `llama-cpp-sys-2` tự dựng llama.cpp bằng
# NDK khi target là *-linux-android, miễn là biết NDK nằm đâu. Nó tìm theo thứ
# tự ANDROID_NDK → ANDROID_NDK_ROOT → NDK_ROOT, rồi suy tiếp từ ANDROID_HOME;
# mức API lấy từ ANDROID_API_LEVEL hoặc ANDROID_PLATFORM. Đặt sẵn hai biến ấy
# trong `.cargo/config.toml` nên build thẳng `cargo build --target
# aarch64-linux-android` là chạy.
#
# Apple cũng dựng được, nhưng phải chỉ đường cho cmake, và bản iOS còn phải gộp
# thêm libcpp-httplib.a mà crate sys quên khai — xem `dung-native-apple.sh` ở
# gốc repo. Đừng thử chữa bằng cách tắt feature `common`: `llama-cpp-2` khai
# `llama-cpp-sys-2` với default features, mà feature trong cargo chỉ cộng thêm
# chứ không trừ bớt được từ bên ngoài.
[dependencies.llama-cpp-2]
version = "0.1.154"

# Bộ mã hoá âm thanh cho việc xuất file — mọi nền tảng trừ Android.
#
# libopus và libmp3lame là mã C. Trên Windows và macOS chúng dựng sạch. Biên
# dịch chéo sang Android thì audiopus_sys không mang theo mã nguồn libopus (nó
# đi tìm thư viện hệ thống qua pkg-config, target Android không có gì để tìm),
# và mp3lame-sys thì đụng stdint.h của NDK — nên Android loại hẳn hai thứ này.
#
# Không phải sửa: Android có sẵn MediaCodec trong hệ điều hành, mã hoá được
# Opus và AAC mà không cần thư viện nào. Nên khai theo target — bản Android
# không kéo chúng vào, và cũng không phải nhồi ffmpeg vào bộ cài.
#
# iOS thì dựng được cả hai, chỉ tốn công chỉ đường: mp3lame-sys tự lo qua
# --host, còn audiopus_sys phải trỏ OPUS_LIB_DIR vào bản libopus dựng tay cho
# đúng kiến trúc/sysroot của iOS — xem `dung-native-apple.sh` ở gốc repo.
[target.'cfg(not(target_os = "android"))'.dependencies]
mp3lame-encoder = "0.2"
audiopus = "0.2"
ogg = "0.9"
# Thuần Rust, không FFI/thư viện C — không có gì để cross-compile, khác hẳn
# hai bộ mã hoá trên. Cho AAC vào Windows/macOS/Linux/iOS dễ như MP3.
rusty_aac = "0.1"
